<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>太空滑鼠入侵 · 遊戲｜將軍澳培智學校</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;margin:0;font-family:"PingFang HK","Noto Sans TC",system-ui,sans-serif;color:#E0F7FA;
background:#050B18;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;border:none;cursor:pointer}
/* full-viewport shell — stage must get real height (absolute kids don't expand parent) */
#gameUI{position:fixed;inset:0;display:flex;flex-direction:column;min-height:0}
.top{flex:0 0 auto;height:clamp(48px,8vh,56px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 10px;
background:linear-gradient(180deg,#0A1628,#07101C);border-bottom:2px solid #00E5FF66}
.who{display:flex;align-items:center;gap:8px;font-weight:900;min-width:0}
.av{width:36px;height:36px;border-radius:50%;border:3px solid #00E5FF;display:grid;place-items:center;font-size:1.15rem;background:#102A43;flex-shrink:0}
.hint{flex:1;text-align:center;font-size:clamp(.85rem,2vw,1.2rem);font-weight:900}
.hint b{background:#FFD54F;color:#1A237E;padding:2px 8px;border-radius:8px}
.icon{width:42px;height:42px;border-radius:14px;background:#102A43;border:2px solid #00E5FF66;font-size:1.05rem;font-weight:900;color:#E0F7FA}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hud{flex:0 0 auto;height:clamp(34px,6vh,40px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;
background:#07101C;border-bottom:1px solid #00E5FF33;font-weight:900;font-size:.95rem}
.hud .score{color:#FFD54F;font-size:1.15rem}
.hud .wave{color:#00E5FF}
.hud .mode-tag{color:#90CAF9;font-size:.85rem}
/* stage fills rest; ship lane = bottom 22%; alien band stays above */
.stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:
radial-gradient(ellipse 80% 45% at 50% 0%,#1A237E55,transparent 60%),
linear-gradient(180deg,#050B18 0%,#0D1B2A 55%,#06101C 100%)}
.stage.shake{animation:shake .2s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.stage::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,229,255,.03) 3px 4px);pointer-events:none;z-index:9}
.stars,.stars2,.stars3{position:absolute;inset:0;pointer-events:none}
.nebula{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.nebula svg{width:100%;height:100%;display:block}
.stars{opacity:.5;animation:starScroll 18s linear infinite;
background-image:radial-gradient(1.5px 1.5px at 12% 18%,#E0F7FA,transparent),radial-gradient(2px 2px at 28% 42%,#fff,transparent),radial-gradient(1px 1px at 55% 12%,#fff,transparent),radial-gradient(2px 2px at 72% 38%,#A5F3FC,transparent),radial-gradient(1px 1px at 88% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 5% 60%,#fff,transparent),radial-gradient(1px 1px at 40% 80%,#B2EBF2,transparent),radial-gradient(2px 2px at 65% 55%,#fff,transparent),radial-gradient(1px 1px at 95% 75%,#fff,transparent)}
.stars2{opacity:.3;animation:starScroll 28s linear infinite;
background-image:radial-gradient(1px 1px at 8% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 22% 70%,#A5F3FC,transparent),radial-gradient(1px 1px at 48% 50%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 15%,#fff,transparent),radial-gradient(1px 1px at 35% 90%,#B2EBF2,transparent),radial-gradient(1px 1px at 60% 35%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 60%,#fff,transparent)}
.stars3{opacity:.18;animation:starScroll 42s linear infinite;
background-image:radial-gradient(2px 2px at 15% 45%,#fff,transparent),radial-gradient(1.5px 1.5px at 50% 25%,#A5F3FC,transparent),radial-gradient(2px 2px at 80% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 65%,#fff,transparent),radial-gradient(2px 2px at 65% 10%,#B2EBF2,transparent)}
@keyframes starScroll{from{background-position:0 0}to{background-position:0 110vh}}
/* F: alien subtle pulse (different speeds per row to feel alive) */
@keyframes alienPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.alien.r0{animation:alienPulse 2.4s ease-in-out infinite}
.alien.r1{animation:alienPulse 2.0s ease-in-out infinite .3s}
.alien.r2{animation:alienPulse 2.6s ease-in-out infinite .6s}
.alien.r3{animation:alienPulse 2.2s ease-in-out infinite .9s}
/* special alien types */
@keyframes kamikazePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.alien-kamikaze{animation:kamikazePulse .35s ease-in-out infinite}
.alien-stealth{transition:opacity .4s}
.alien-healer{filter:drop-shadow(0 0 6px #69F0AE)}
.alien-armored{box-shadow:0 0 12px #FFB300, inset 0 0 8px #FFB30044}
.alien-splitter{filter:drop-shadow(0 0 8px #CE93D8)}
/* healer aura pulse when active */
@keyframes healerAura{0%,100%{box-shadow:0 0 6px #69F0AE}50%{box-shadow:0 0 18px #69F0AE,0 0 30px #69F0AE66}}
.alien-healer.aura-active{animation:healerAura .4s ease-in-out}
/* F: power-up icon slow rotate */
@keyframes puSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.pu svg{animation:puSpin 8s linear infinite}
/* F: nebula planet slow drift + twinkle */
@keyframes planetDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(-12px,8px)}}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.nebula svg circle[opacity]{animation:twinkle 3s ease-in-out infinite}
.alien{position:absolute;width:clamp(40px,7vw,56px);height:clamp(40px,7vw,56px);display:grid;place-items:center;
font-size:clamp(1.5rem,5vw,2.3rem);line-height:1;z-index:3;
border-radius:12px;transition:opacity .1s,transform .1s;pointer-events:none}
/* alien glow aura — color set per row by JS */
.alien.r0{filter:drop-shadow(0 0 10px #CE93D8);background:radial-gradient(circle at 50% 45%,#CE93D855,#6A1B9A33 70%,transparent)}
.alien.r1{filter:drop-shadow(0 0 10px #EF9A9A);background:radial-gradient(circle at 50% 45%,#EF9A9A55,#B71C1C33 70%,transparent)}
.alien.r2{filter:drop-shadow(0 0 10px #80DEEA);background:radial-gradient(circle at 50% 45%,#80DEEA55,#00606433 70%,transparent)}
.alien.r3{filter:drop-shadow(0 0 10px #A5D6A7);background:radial-gradient(circle at 50% 45%,#A5D6A755,#1B5E2033 70%,transparent)}
.alien svg{width:100%;height:100%;display:block}
/* hit flash — brief white overlay */
.alien.hit-flash{animation:hf 80ms ease-out forwards}
@keyframes hf{0%{filter:brightness(3) drop-shadow(0 0 16px #fff)}100%{filter:brightness(1)}}
.alien.dead{opacity:0;transform:scale(1.35) rotate(10deg)}
.ship-wrap{position:absolute;bottom:clamp(10px,2.2vh,18px);left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.ship{width:clamp(52px,9vw,72px);height:clamp(52px,9vw,72px);display:grid;place-items:center;
font-size:clamp(2.1rem,6vw,2.8rem);line-height:1;
background:radial-gradient(circle at 50% 40%,#00E5FF66,#0D47A133 65%,transparent);
border-radius:50%;filter:drop-shadow(0 0 16px #00E5FF);animation:hover 1.5s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.ship-glow{width:42px;height:8px;border-radius:50%;background:radial-gradient(ellipse,#00E5FF88,transparent);margin-top:-3px}
/* SVG ship replaces emoji */
#shipSvg{width:100%;height:100%;display:block}
/* thrust engine flame */
#thrust{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);width:clamp(18px,3vw,26px);height:clamp(18px,3vw,26px);opacity:.9;animation:throb .12s ease-in-out infinite alternate}
@keyframes throb{0%{opacity:.7;transform:translateX(-50%) scaleY(.85)}100%{opacity:1;transform:translateX(-50%) scaleY(1.15)}}
#thrustOuter{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:clamp(26px,4vw,36px);height:clamp(26px,4vw,36px);border-radius:50%;background:radial-gradient(ellipse at 50% 20%,#FF8C0088,transparent 70%);animation:thrustRing .12s ease-in-out infinite alternate;opacity:.6}
@keyframes thrustRing{0%{opacity:.4;transform:translateX(-50%) scale(.8)}100%{opacity:.7;transform:translateX(-50%) scale(1.1)}}
.laser{position:absolute;width:8px;height:28px;border-radius:4px;
background:linear-gradient(#fff 0%,#00E5FF 30%,#00BCD4 70%,#FFD54F 100%);
box-shadow:0 0 8px #00E5FF,0 0 16px #00E5FF,0 0 4px #fff,0 2px 10px #00BCD488;
z-index:5;pointer-events:none}
/* laser trail — second narrower layer behind */
.laser::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
top:100%;width:5px;height:40px;
background:linear-gradient(to bottom,#00E5FF44,transparent);
border-radius:3px;pointer-events:none}
.boom{position:absolute;font-size:1.5rem;z-index:7;pointer-events:none;animation:boom .35s ease forwards;width:1em;height:1em;line-height:0}
.boom svg{width:100%;height:100%;display:block}
@keyframes boom{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(1.6)}}
.pop{position:absolute;z-index:8;font-weight:900;font-size:1rem;color:#FFD54F;text-shadow:0 0 8px #00E5FF;pointer-events:none;animation:pop .5s ease forwards}
@keyframes pop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}

/* enemy bullet (chaos/blitz themes) */
.alien-laser{position:absolute;width:6px;height:18px;border-radius:3px;background:linear-gradient(180deg,#FF5252,#B71C1C);box-shadow:0 0 10px #FF5252,0 0 4px #fff;z-index:4;pointer-events:none}
.alien-laser.horizontal{width:18px;height:6px;background:linear-gradient(90deg,#B71C1C,#FF5252);box-shadow:0 0 10px #FF5252,0 0 4px #fff}
/* landscape: player laser fires right (horizontal) */
.laser.horizontal{width:18px;height:6px;background:linear-gradient(90deg,#00BCD4,#FFD54F 70%,#fff);box-shadow:0 0 8px #00E5FF,0 0 16px #00E5FF,0 0 4px #fff}
.laser.horizontal::after{left:100%;top:50%;transform:translateY(-50%);width:40px;height:5px;background:linear-gradient(to right,#00E5FF44,transparent)}
/* landscape mode: background scrolls right-to-left */
body.landscape .stars{animation:starScroll 18s linear infinite reverse}
body.landscape .stars2{animation:starScroll 28s linear infinite reverse}
body.landscape .stars3{animation:starScroll 42s linear infinite reverse}
/* brief red flash on the alien that's about to shoot */
.alien.shooting{filter:drop-shadow(0 0 14px #FF5252) brightness(1.5)!important;animation:shootFlash .12s steps(2) 1}
@keyframes shootFlash{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}

/* power-up pickup burst */
.pu-burst{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:9;box-shadow:0 0 8px currentColor;animation:puBurst .65s ease-out forwards}
@keyframes puBurst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
/* power-up big banner above ship */
.pu-banner{position:absolute;z-index:10;font-weight:900;font-size:2rem;text-shadow:0 0 16px currentColor,0 0 32px currentColor,0 2px 4px #000;pointer-events:none;width:240px;text-align:center;animation:puBanner 1.4s ease-out forwards;letter-spacing:1px}
.pu-banner .label{font-size:.85rem;opacity:.9;display:block;margin-top:2px;text-shadow:0 1px 2px #000;letter-spacing:2px}
@keyframes puBanner{0%{opacity:0;transform:translateY(20px) scale(.4)}15%{opacity:1;transform:translateY(0) scale(1.4)}30%{transform:translateY(0) scale(1)}85%{opacity:1;transform:translateY(-20px) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(.9)}}
.pu-flash{position:fixed;inset:0;pointer-events:none;z-index:28;background:currentColor;opacity:.4;animation:puFlash .4s ease-out forwards}
@keyframes puFlash{0%{opacity:.4}100%{opacity:0}}
.pu-pickup-zoom{animation:puPickupZoom .35s ease-out}
@keyframes puPickupZoom{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
/* hit feedback (HP lost) */
.hit-red{position:fixed;inset:0;pointer-events:none;z-index:25;background:radial-gradient(circle, #FF1744 0%, transparent 70%);opacity:0;animation:hitRed .5s ease-out forwards}
@keyframes hitRed{0%{opacity:.7}100%{opacity:0}}
.lives .heart-icon.hit-anim{animation:heartHit .6s ease-out}
@keyframes heartHit{0%{transform:scale(1)}20%{transform:scale(1.6);filter:drop-shadow(0 0 12px #FF1744) brightness(2)}100%{transform:scale(1);filter:grayscale(1) drop-shadow(0 0 0 transparent);opacity:.18}}
.ship-damaged{animation:shipDamaged .15s ease-in-out 3}
@keyframes shipDamaged{0%,100%{filter:brightness(1)}50%{filter:brightness(2) sepia(1) hue-rotate(-50deg) saturate(4)}}
/* ship lane marker only — aliens never cross (layout clamp) */
.ship-lane{position:absolute;left:4%;right:4%;bottom:20%;height:1px;background:linear-gradient(90deg,transparent,#00E5FF44,transparent);z-index:2;pointer-events:none}
.guide{position:absolute;left:10px;bottom:clamp(6px,1.5vh,10px);z-index:5;background:rgba(10,22,40,.92);border:2px solid #00E5FF;border-radius:14px;padding:6px 10px;font-weight:900;max-width:min(52%,280px);font-size:clamp(.8rem,2vw,.9rem);pointer-events:none}
@media (max-height:700px){.guide{display:none}} /* iPad landscape / short: hide tip bar */
.combo{position:absolute;top:10px;right:10px;z-index:6;font-size:clamp(1rem,2.8vw,1.35rem);font-weight:900;color:#FFD54F;text-shadow:0 0 10px #FF6B9D;opacity:0;transform:scale(.8);transition:.15s;pointer-events:none}
.combo.on{opacity:1;transform:scale(1.1)}
.heart{position:absolute;top:10px;left:10px;z-index:5;font-size:.85rem;font-weight:900;color:#80DEEA;pointer-events:none}
.wave-clear{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.85);z-index:12;background:rgba(10,22,40,.94);border:3px solid #FFD54F;color:#FFD54F;font-weight:900;font-size:clamp(1.1rem,3.2vw,1.55rem);padding:12px 16px;border-radius:18px;opacity:0;pointer-events:none;transition:.2s;text-align:center}
.wave-clear.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pause-overlay{position:absolute;inset:0;background:rgba(5,11,24,.78);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(2px)}
.pause-overlay.on{display:flex}
.pause-card{background:#fff;border:5px solid #00E5FF;border-radius:28px;padding:24px 36px;text-align:center;color:#3D2B5A;box-shadow:0 8px 32px rgba(0,0,0,.4);min-width:220px}
.pause-icon{font-size:3.6rem;line-height:1;color:#426eb4;margin-bottom:4px}
.pause-title{font-size:1.6rem;font-weight:900;margin-bottom:14px;color:#1A237E}
.ach-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-30px);background:linear-gradient(135deg,#FFD54F,#FF6B9D);color:#fff;padding:10px 18px;border-radius:18px;display:flex;align-items:center;gap:12px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:.3s;font-weight:900;border:3px solid #fff}
.ach-toast.in{opacity:1;transform:translateX(-50%) translateY(0)}
.ach-sticker{font-size:2.4rem;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.ach-text{text-align:left;line-height:1.1}
.ach-label{font-size:.7rem;opacity:.95;letter-spacing:1px}
.ach-name{font-size:1.1rem}
.boss{position:absolute;z-index:7;display:grid;place-items:center;filter:drop-shadow(0 0 16px rgba(255,107,157,.5));animation:bossFloat 2.4s ease-in-out infinite}
.boss svg{width:100%;height:100%}
.boss.hit-flash{animation:hf 80ms ease-out forwards, bossFloat 2.4s ease-in-out infinite}
.boss.dead{opacity:0;transform:scale(1.6) rotate(15deg);transition:.4s}
@keyframes bossFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.boss-hp{position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(280px,60vw);height:22px;background:rgba(5,11,24,.85);border:2px solid #FF6B9D;border-radius:14px;overflow:hidden;z-index:13;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.boss-hp-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#FFD54F,#FF6B9D);transition:width .15s;width:100%}
.boss-hp-text{position:relative;z-index:1;font-size:.7rem;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);letter-spacing:.5px}
.boss-hp.low{border-color:#FF1744;animation:bossLow .5s ease-in-out infinite}
.boss-hp.low .boss-hp-fill{background:linear-gradient(90deg,#FF1744,#FF6B9D)}
@keyframes bossLow{0%,100%{box-shadow:0 4px 12px rgba(255,23,68,.4)}50%{box-shadow:0 4px 18px rgba(255,23,68,.8)}}
.drone{position:absolute;width:32px;height:32px;z-index:6;pointer-events:none;filter:drop-shadow(0 0 6px #00E5FF);animation:droneBob 1.6s ease-in-out infinite}
.drone svg{width:100%;height:100%}
.drone.fading{opacity:0;transition:.4s}
@keyframes droneBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.drone-laser{color:#00E5FF!important;font-size:1.4rem;line-height:1;text-shadow:0 0 4px #00E5FF,0 0 8px #00E5FF;z-index:5}
.elite-glow{animation:eliteGlow 0.7s ease-in-out infinite alternate}
@keyframes eliteGlow{0%{filter:drop-shadow(0 0 6px #FF6B9D) brightness(1)}100%{filter:drop-shadow(0 0 18px #FF1744) brightness(1.4)}}
.elite-shoot{animation:eliteShoot 0.12s ease-out}
@keyframes eliteShoot{0%{filter:brightness(2)}100%{filter:none}}
.shield-count{display:inline-block;margin-left:8px;font-size:.75rem;color:#00E5FF;font-weight:700}
.bonus-active{animation:bonusPulse 0.5s ease-in-out infinite alternate}
@keyframes bonusPulse{0%{text-shadow:0 0 6px #FFD54F}100%{text-shadow:0 0 18px #FF6B9D,0 0 30px #FFD54F}}

/* ── ship theme overrides (color per ship) ── */
.ship-themed{transition:filter .3s, background .3s}
body.ship-whale .ship-themed{filter:drop-shadow(0 0 14px #00E5FF)}
body.ship-swallow .ship-themed{filter:drop-shadow(0 0 14px #FF6B9D)}
body.ship-turtle .ship-themed{filter:drop-shadow(0 0 14px #69F0AE)}
body.ship-phoenix .ship-themed{filter:drop-shadow(0 0 14px #FF8C00)}
.ship-tag{font-size:.85rem;font-weight:900;padding:2px 6px;border-radius:6px;color:#fff}
body.ship-whale .ship-tag{background:#00BCD4}
body.ship-swallow .ship-tag{background:#FF6B9D}
body.ship-turtle .ship-tag{background:#4CAF50}
body.ship-phoenix .ship-tag{background:#FF8C00}
.lives{display:inline-flex;gap:4px;margin-left:8px;font-size:1.4rem;line-height:1;vertical-align:middle}
.lives .heart-icon{filter:drop-shadow(0 0 6px #FF1744);transition:opacity .3s,filter .3s;display:inline-block}
.lives .heart-icon.lost{opacity:.22;filter:grayscale(1) drop-shadow(0 0 0 transparent)}
.skill-btn{position:absolute;right:12px;bottom:80px;z-index:8;width:84px;height:84px;border-radius:50%;
  border:4px solid currentColor;background:rgba(10,22,40,.85);color:#00E5FF;display:grid;place-items:center;
  font-size:2.2rem;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  box-shadow:0 0 18px currentColor,inset 0 0 10px rgba(0,0,0,.3);transition:transform .12s, opacity .2s;
  font-weight:900}
.skill-btn.ready{animation:skillReady 1.6s ease-in-out infinite}
@keyframes skillReady{0%,100%{box-shadow:0 0 18px currentColor}50%{box-shadow:0 0 32px currentColor, 0 0 48px currentColor}}
.skill-btn.cooldown{color:#555!important;background:rgba(20,30,50,.85);box-shadow:none;cursor:not-allowed;animation:none;opacity:.6}
.skill-btn.cooldown::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.7) var(--cd, 0%), transparent 0);pointer-events:none}
.skill-btn .cd-num{position:absolute;font-size:.7rem;bottom:6px;left:0;right:0;text-align:center;color:#fff;font-weight:900;letter-spacing:1px}
.skill-btn .skill-label{position:absolute;font-size:.55rem;top:2px;left:0;right:0;text-align:center;color:currentColor;opacity:.7;letter-spacing:1px}
.skill-btn.pressed{transform:scale(.9)}
@media (max-height:600px){.skill-btn{width:64px;height:64px;font-size:1.7rem;bottom:60px}}
/* iPad D-pad (L/R buttons) */
.dpad{position:absolute;left:20px;bottom:80px;display:flex;gap:18px;z-index:8;pointer-events:none}
.dpad-btn{width:90px;height:90px;border-radius:50%;background:rgba(10,22,40,.85);border:4px solid #00E5FF;color:#00E5FF;font-size:2.2rem;font-weight:900;pointer-events:auto;display:grid;place-items:center;box-shadow:0 0 18px #00E5FF88,inset 0 0 10px rgba(0,229,255,.2);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .08s, background .08s, box-shadow .08s;cursor:pointer}
.dpad-btn:active,.dpad-btn.pressed{transform:scale(.92);background:rgba(0,229,255,.35);box-shadow:0 0 28px #00E5FF,inset 0 0 18px rgba(0,229,255,.4)}
.dpad-btn .sub{position:absolute;font-size:.5rem;bottom:6px;left:0;right:0;text-align:center;color:#FFFFFF;opacity:.7;letter-spacing:1px}
@media (max-height:600px){.dpad-btn{width:70px;height:70px;font-size:1.8rem}.dpad{bottom:60px;gap:14px}}
/* wasd mode visual hint */
.wasd-hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:6;background:rgba(10,22,40,.85);border:2px solid #00E5FF;border-radius:14px;padding:6px 12px;font-weight:900;color:#00E5FF;font-size:.9rem;letter-spacing:1px;pointer-events:none;animation:wasdFade 4s ease-out forwards}
@keyframes wasdFade{0%{opacity:0;transform:translateX(-50%) translateY(10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
.skill-burst{position:absolute;z-index:7;pointer-events:none;border-radius:50%;background:radial-gradient(circle, var(--c) 0%, transparent 70%);animation:burst .6s ease-out forwards}
@keyframes burst{0%{transform:scale(0);opacity:1}100%{transform:scale(2.5);opacity:0}}
.dash-trail{position:absolute;z-index:5;pointer-events:none;border-radius:50%;background:radial-gradient(circle, var(--c) 0%, transparent 70%);animation:dashTrail .45s ease-out forwards}
@keyframes dashTrail{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(.4)}}
.wall-bar{position:absolute;z-index:5;pointer-events:none;border-radius:6px;border:3px solid #69F0AE;background:linear-gradient(180deg, rgba(105,240,174,.35), rgba(105,240,174,.15));box-shadow:0 0 16px #69F0AE88}
.flame-laser{background:linear-gradient(180deg,#FFEB3B,#FF6D00 60%,#B71C1C)!important;box-shadow:0 0 14px #FF8C00,0 0 28px #FF6B9D!important}
.burn-dot{position:absolute;border-radius:50%;background:radial-gradient(circle, #FFEB3B, #FF6D00 60%, transparent 80%);pointer-events:none;z-index:3;animation:burnFade .8s ease-out forwards}
@keyframes burnFade{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
.album-modal{width:min(560px,94vw);max-height:90vh;overflow:auto;position:relative;padding:18px 16px}
.album-close{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:#eee;border:2px solid #426eb4;color:#426eb4;font-size:1.1rem;font-weight:900;cursor:pointer}
.album-modal h2{font-size:1.4rem;margin-bottom:10px}
.album-progress{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.album-bar{flex:1;height:14px;background:#eee;border-radius:7px;overflow:hidden;border:2px solid #426eb4}
.album-fill{height:100%;background:linear-gradient(90deg,#FFD54F,#FF6B9D);transition:width .4s;width:0}
.album-text{font-weight:900;color:#426eb4;font-size:.95rem;min-width:54px;text-align:right}
.album-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sticker-card{background:linear-gradient(135deg,#f3e5f5,#e1f5fe);border:3px solid #fff;border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.1);transition:transform .15s}
.sticker-card.locked{background:#d0d0d0;filter:grayscale(1);opacity:.55}
.sticker-card .sticker-icon{font-size:2.6rem;line-height:1;margin-bottom:4px;display:block}
.sticker-card.locked .sticker-icon::after{content:'🔒';position:relative;display:inline-block;font-size:1rem;margin-left:2px}
.sticker-card .sticker-label{font-weight:900;color:#1A237E;font-size:.85rem;line-height:1.2;margin-bottom:2px}
.sticker-card .sticker-hint{font-size:.7rem;color:#555;line-height:1.2}
.sticker-card.new{animation:stickerPop .6s ease}
@keyframes stickerPop{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.ufo{position:absolute;top:44px;font-size:clamp(1.7rem,4.5vw,2.3rem);z-index:4;filter:drop-shadow(0 0 12px #FFD54F);pointer-events:none}
.bunker{position:absolute;z-index:4;width:70px;height:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#69F0AE,#2E7D32);border:2px solid #A5D6A7}
.bunker.d2{background:linear-gradient(180deg,#AED581,#558B2F);opacity:.85}
.bunker.d1{background:linear-gradient(180deg,#9E9E9E,#616161);opacity:.7;height:26px}
.bunker.dead{opacity:0}
/* shield ring around ship */
.ship-shield{position:absolute;border-radius:50%;border:3px solid #00E5FF;box-shadow:0 0 16px #00E5FF88,inset 0 0 12px #00E5FF33;pointer-events:none;z-index:5;opacity:0;transition:opacity .3s}
.ship-shield.on{opacity:1;animation:shield-pulse 1.2s ease-in-out infinite}
@keyframes shield-pulse{0%,100%{box-shadow:0 0 16px #00E5FF88,inset 0 0 12px #00E5FF33}50%{box-shadow:0 0 28px #00E5FF,inset 0 0 20px #00E5FF55}}
/* power-up drops */
.pu{position:absolute;font-size:clamp(1.3rem,3.5vw,1.7rem);z-index:5;pointer-events:none;filter:drop-shadow(0 0 8px currentColor);padding:4px;border-radius:10px;background:rgba(0,0,0,.55);border:2px solid currentColor;line-height:0}
.pu svg{width:1em;height:1em;display:block}
@keyframes pu-glow{0%,100%{filter:drop-shadow(0 0 6px currentColor) brightness(1)}50%{filter:drop-shadow(0 0 14px currentColor) brightness(1.2)}}
.pu{animation:pu-glow 0.8s ease-in-out infinite}
.pu-score{color:#FFD54F;border-color:#FFD54F}
.pu-shield{color:#00E5FF;border-color:#00E5FF}
.pu-rapid{color:#FF6B9D;border-color:#FF6B9D}
.pu-freeze{color:#A5F3FC;border-color:#A5F3FC}
/* score flash */
.flash{position:fixed;inset:0;background:rgba(255,213,79,.18);pointer-events:none;z-index:30;opacity:0;transition:opacity .08s}
.flash.on{opacity:1}
/* big score pop */
.pop.big-pop{font-size:1.5rem;color:#FFD54F}
/* trophy row on HUD */
.trophy-row{display:flex;gap:10px;align-items:center;font-size:.9rem}
.trophy-row span{opacity:.8;font-weight:900}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) scale(.92);background:#fff;border:4px solid #22c55e;color:#166534;font-size:1.25rem;font-weight:900;padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}.toast.bad{border-color:#FF6B9D;color:#9f1239}
/* danger — alien approaching ship lane */
.stage.danger{border:2px solid #FF6B9D88;animation:danger-pulse .4s ease-in-out infinite}
@keyframes danger-pulse{0%,100%{border-color:#FF6B9D88}50%{border-color:#FF1744AA}}
/* second explosion layer */
.boom2{position:absolute;font-size:1.1rem;z-index:7;pointer-events:none;animation:boom2 .3s ease forwards;width:1em;height:1em;line-height:0}
.boom2 svg{width:100%;height:100%;display:block}
@keyframes boom2{0%{opacity:1;transform:scale(.4) rotate(0deg)}100%{opacity:0;transform:scale(2.2) rotate(20deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* alien debris particles */
.debris{position:absolute;pointer-events:none;z-index:8;border-radius:50%;animation:debrisFly .55s ease-out forwards}
@keyframes debrisFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}}
.overlay{position:fixed;inset:0;background:rgba(5,11,24,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{width:min(440px,94vw);background:#fff;border:5px solid #FFD54F;border-radius:28px;padding:20px 14px;text-align:center;color:#3D2B5A;max-height:92vh;overflow:auto}
.modal h2{font-size:1.7rem;margin-bottom:4px}
.modal .big{font-size:2.2rem;font-weight:900;color:#426eb4;margin:6px 0}
.modal p{font-weight:800;opacity:.85;margin-bottom:8px}
.btn{min-height:52px;min-width:110px;padding:10px 14px;border-radius:999px;background:linear-gradient(135deg,#00BCD4,#7C4DFF);color:#fff;font-size:1.1rem;font-weight:900}
.btn.ghost{background:#fff;color:#3D2B5A;border:3px solid rgba(61,43,90,.12)}
.btn.school{background:#426eb4}
#certPrint{display:none}
body.printing #gameUI{display:none!important}
body.printing #certPrint{display:block!important}
@media print{
  @page{size:A4 landscape;margin:12mm}
  html,body{background:#fff!important;height:auto!important;overflow:visible!important}

  body.printing #certPrint{display:block!important}
  #certSheet{width:100%;border:6px solid #426eb4;border-radius:12px;padding:18px;text-align:center}
}
</style>

<script>
/**
 * Classic Space Invaders loop (SEN mouse trainer)
 * Modes: move (auto) | left click | right click
 * No timer — score + endless deepening waves
 */
const S = SIMouse, $ = S.$;
S.lockSEN(); S.armAudio();

const params = new URLSearchParams(location.search);
// accept any known mode id (incl. ipad / wasd); fall back to move if missing/unknown
const _validIds = S.MODES.map(function (m) { return m.id; });
const modeId = _validIds.includes(params.get('mode')) ? params.get('mode') : 'move';
const mode = S.modeMeta(modeId);

const ROWS_FACE = ['🦑', '🦀', '🐙', '👾'];

/* 4 alien SVG designs, one per row — multi-layer + glow */
var ALIEN_SVG = [
/* r0 — squid / cthulhu (purple) */
`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="gA0a" cx="50%" cy="25%" r="65%"><stop offset="0%" stop-color="#F3E5F5"/><stop offset="35%" stop-color="#CE93D8"/><stop offset="70%" stop-color="#AB47BC"/><stop offset="100%" stop-color="#4A148C"/></radialGradient>
  <radialGradient id="gA0b" cx="50%" cy="20%" r="40%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity=".65"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="gA0c" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#CE93D8" stop-opacity=".5"/><stop offset="100%" stop-color="#CE93D8" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="32" cy="28" rx="30" ry="24" fill="url(#gA0c)"/>
<!-- head dome -->
<ellipse cx="32" cy="22" rx="20" ry="16" fill="url(#gA0a)" stroke="#E1BEE7" stroke-width="1.2"/>
<ellipse cx="32" cy="18" rx="11" ry="6" fill="url(#gA0b)"/>
<!-- 3 dorsal spots -->
<circle cx="32" cy="14" r="1.2" fill="#E1BEE7" opacity=".7"/>
<circle cx="26" cy="16" r="0.8" fill="#E1BEE7" opacity=".5"/>
<circle cx="38" cy="16" r="0.8" fill="#E1BEE7" opacity=".5"/>
<!-- left eye — 3 layers -->
<ellipse cx="25" cy="19" rx="5.5" ry="6.5" fill="#0a0a1a" stroke="#CE93D8" stroke-width=".6"/>
<ellipse cx="25" cy="18" rx="3.5" ry="4.5" fill="#FF1744" opacity=".9"/>
<ellipse cx="25" cy="17" rx="1.5" ry="2" fill="#FFFFFF"/>

/** Layout metrics — PC + iPad safe bands (aliens never enter ship lane) */
function layout() {
  const el = stage || document.getElementById('stage');
  const r = el.getBoundingClientRect();
  // fallback if stage not laid out yet
  const h = Math.max(r.height || 0, window.innerHeight * 0.7, 320);
  const w = Math.max(r.width || 0, window.innerWidth * 0.9, 280);
  const shipLane = h * 0.22;
  const bunkerY = h - shipLane - h * 0.06;
  const alienMaxY = h * 0.58;
  const alienTop = Math.max(52, h * 0.1);
  const alienH = Math.max(36, Math.min(56, w * 0.07));
  return { w, h, shipLane, bunkerY, alienMaxY, alienTop, alienH };
}

/** Wave blueprint — deepens forever, sized to viewport */
function waveSpec(w) {
  const L = layout();
  const short = L.h < 520; // iPad landscape / short window
  const maxRows = short ? 3 : 4;
  const maxCols = short ? 6 : (L.w < 700 ? 6 : 8);
  const rows = Math.min(maxRows, 2 + Math.floor((w - 1) / 3));
  const cols = Math.min(maxCols, 4 + Math.floor((w - 1) / 2));
  const basePeriod = Math.max(12, 36 - w * 2);
  const minPeriod = Math.max(5, 12 - Math.floor(w / 2));
  const drop = Math.min(14, 8 + Math.floor(w / 2)); // small steps only
  const bunkers = w >= 3 ? Math.min(3, 2 + Math.floor((w - 3) / 3)) : 0;
  // slight lower start, but matrix must still fit under alienMaxY
  const gapY = Math.min(L.alienH + 6, (L.alienMaxY - L.alienTop - 20) / Math.max(1, rows));
  const maxBias = Math.max(0, L.alienMaxY - L.alienTop - gapY * (rows - 1) - L.alienH - 8);
  const yBias = Math.min(maxBias, (w - 1) * 4);
  return { rows, cols, basePeriod, minPeriod, drop, bunkers, yBias, gapY };
}

/* ── ship system ── */
function initShip() {
  const id = params.get('ship') || S.loadShip();
  ship = S.shipMeta(id);
  document.body.classList.remove('ship-whale','ship-swallow','ship-turtle','ship-phoenix');
  document.body.classList.add('ship-' + ship.id);
  document.body.classList.toggle('landscape', !!mode.horizontal);
  S.saveShip(ship.id);
  $('shipEl').innerHTML = SHIP_SVGS[ship.id];
  $('shipTag').textContent = ship.emoji + ' ' + ship.name;
  $('skillIcon').textContent = ship.skill.emoji;
  $('skillLabel').textContent = ship.skill.name;
  $('skillBtn').style.color = ship.skill.color;
}

function renderLives() {
  const el = $('lives');
  el.innerHTML = '';
  for (let i = 0; i < shipMaxLife; i++) {
    const h = document.createElement('span');
    h.className = 'heart-icon' + (i >= shipLife ? ' lost' : '');
    h.textContent = '♥';
    el.appendChild(h);
  }
}

function skillReady() { return Date.now() >= skillCdEnd && !didEnd && !pause; }
function skillProgress() {
  // 0..1 — how much of CD has elapsed
  const cd = ship.skill.cd;
  return Math.max(0, Math.min(1, 1 - (skillCdEnd - Date.now()) / cd));
}

function updateSkillBtn() {
  const btn = $('skillBtn');
  const cdNum = $('skillCdNum');
  if (skillReady()) {
    btn.classList.add('ready');
    btn.classList.remove('cooldown');
    btn.style.setProperty('--cd', '0%');
    cdNum.style.display = 'none';
  } else {
    btn.classList.remove('ready');
    btn.classList.add('cooldown');
    const left = Math.max(0, skillCdEnd - Date.now());
    const pct = (left / ship.skill.cd) * 100;
    btn.style.setProperty('--cd', pct + '%');
    cdNum.style.display = 'block';
    cdNum.textContent = (left / 1000).toFixed(1) + 's';
  }
}

/* ── 4 ship skills ── */
function useShipSkill() {
  if (!skillReady()) return;
  skillCdEnd = Date.now() + ship.skill.cd;
  S.toast(ship.skill.emoji + ' ' + ship.skill.name);
  S.tone(660, 0.12, 'triangle', 0.16);
  if (ship.skill.id === 'burst') skillBurst();
  else if (ship.skill.id === 'dash') skillDash();
  else if (ship.skill.id === 'wall') skillWall();
  else if (ship.skill.id === 'ring') skillRing();
}

// Whale 三連射 — fires 3 bullets in ±15° spread
function skillBurst() {
  const r = stage.getBoundingClientRect();
  const sx = shipX * r.width;
  const sy = mode.freeMove ? shipY : r.height - 44;
  const baseSpeed = isRapid() ? -20 : -14;
  [-0.22, 0, 0.22].forEach(angle => {
    const el = document.createElement('div');
    el.className = 'laser';
    el.style.left = (sx - 2.5) + 'px';
    el.style.top  = (sy - 26) + 'px';
    stage.appendChild(el);
    lasers.push({ el, x: sx, y: sy - 26, dx: Math.sin(angle) * Math.abs(baseSpeed), dy: Math.cos(angle) * baseSpeed, player: true, born: Date.now() });
  });
  S.tone(880, 0.12, 'triangle', 0.14);
  // visual burst
  spawnSkillBurst(sx, sy - 26, ship.skill.color);
}

// Swallow 瞬閃 — 300ms invincible + 100px dash
function skillDash() {
  dashEnd = Date.now() + 300;
  invincibleEnd = Math.max(invincibleEnd, dashEnd);
  // trail
  const r = stage.getBoundingClientRect();
  const sx = shipX * r.width;
  const sy = mode.freeMove ? shipY : r.height - 44;
  for (let i = 0; i < 4; i++) {
    setTimeout(() => {
      const t = document.createElement('div');
      t.className = 'dash-trail';
      t.style.cssText = 'left:' + (sx - 32) + 'px; top:' + (sy - 32) + 'px; width:64px; height:64px; --c:' + ship.skill.color;
      stage.appendChild(t);
      setTimeout(() => t.remove(), 500);
    }, i * 70);
  }
  S.tone(1200, 0.08, 'sine', 0.14);
  S.tone(800, 0.15, 'sawtooth', 0.12);
}

// Turtle 能量盾牆 — 3s wall in front of ship, blocks 5 hits
function skillWall() {
  wallEnd = Date.now() + 3000;
  wallHitsLeft = 5;
  S.tone(220, 0.15, 'sine', 0.14);
  setTimeout(() => S.tone(220, 0.15, 'sine', 0.14), 120);
  S.toast('🛡️ 盾牆 5 發');
}

function tickWall(L) {
  if (Date.now() >= wallEnd) {
    if (wallEl && wallEl.parentNode) wallEl.remove();
    wallEl = null;
    return;
  }
  if (!wallEl || !wallEl.parentNode) {
    wallEl = document.createElement('div');
    wallEl.className = 'wall-bar';
    stage.appendChild(wallEl);
  }
  const shipTop = L.h - L.shipLane - 12;
  const w = 14, h = 120;
  wallEl.style.width = w + 'px';
  wallEl.style.height = h + 'px';
  wallEl.style.left = (shipX * L.w - w/2) + 'px';
  wallEl.style.top = (shipTop - h + 10) + 'px';
  wallEl.textContent = wallHitsLeft + '';
  wallEl.style.color = '#fff';
  wallEl.style.textAlign = 'center';
  wallEl.style.fontSize = '.8rem';
  wallEl.style.fontWeight = '900';
  wallEl.style.lineHeight = h + 'px';
  wallEl.style.textShadow = '0 0 4px #000';
}

// Phoenix 烈焰環 — 360° 8-bullet burst around ship
function skillRing() {
  const r = stage.getBoundingClientRect();
  const sx = shipX * r.width;
  const sy = mode.freeMove ? shipY : r.height - 44;
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const spd = 5;
    const el = document.createElement('div');
    el.className = 'laser flame-laser';
    el.style.left = (sx - 4) + 'px';
    el.style.top = (sy - 16) + 'px';
    stage.appendChild(el);
    lasers.push({ el, x: sx, y: sy - 16, dx: Math.cos(angle) * spd, dy: Math.sin(angle) * spd, age: 0, player: true, born: Date.now(), _ring: true });
  }
  spawnSkillBurst(sx, sy, ship.skill.color);
  S.tone(440, 0.1, 'square', 0.14);
  setTimeout(() => S.tone(330, 0.12, 'square', 0.14), 80);
  S.toast('💥 烈焰環！');
}

function spawnSkillBurst(cx, cy, color) {

/* ── control setup (iPad D-pad + WASD keyboard) ── */
function setupControls() {
  const dpad = $('dpad');
  // iPad: show D-pad
  if (mode.id === 'ipad') {
    dpad.style.display = 'flex';
    const left = $('dpadLeft'), right = $('dpadRight');
    const setLeft = (v) => { keyLeft = v; left.classList.toggle('pressed', v); };
    const setRight = (v) => { keyRight = v; right.classList.toggle('pressed', v); };
    // pointer events (works for mouse + touch)
    left.addEventListener('pointerdown', (e) => { e.preventDefault(); setLeft(true); });
    left.addEventListener('pointerup', (e) => { e.preventDefault(); setLeft(false); });
    left.addEventListener('pointercancel', () => setLeft(false));
    left.addEventListener('pointerleave', () => setLeft(false));
    right.addEventListener('pointerdown', (e) => { e.preventDefault(); setRight(true); });
    right.addEventListener('pointerup', (e) => { e.preventDefault(); setRight(false); });
    right.addEventListener('pointercancel', () => setRight(false));
    right.addEventListener('pointerleave', () => setRight(false));
  } else {
    dpad.style.display = 'none';
  }
  // WASD: show one-time hint
  if (mode.id === 'wasd') {
    const hint = document.createElement('div');
    hint.className = 'wasd-hint';
    hint.textContent = 'A / D 或 ← / → 移動';
    stage.appendChild(hint);
    setTimeout(() => { if (hint.parentNode) hint.remove(); }, 4200);
  }
}
// Universal keyboard tracking (only matters in wasd mode but always track for simplicity)
window.addEventListener('keydown', (e) => {
  if (e.repeat) return; // ignore key repeat
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') { e.preventDefault(); keyLeft = true; }
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') { e.preventDefault(); keyRight = true; }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keyLeft = false;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keyRight = false;
});

  if (mode.horizontal) {

    shipWrap.style.top = shipY + 'px';
  } else {

    shipWrap.style.left = (shipX * 100) + '%';
    if (mode.freeMove) {
      const minY = r.height * 0.20;
      const maxY = r.height * 0.78;
      shipY = Math.max(minY, Math.min(maxY, e.clientY - r.top));
      shipWrap.style.top = shipY + 'px';
    }
  }
});

function tryLeftShoot(e) {
  if ((mode.id !== 'left' && mode.id !== 'left+') || didEnd) return;
  if (e && e.target && e.target.closest && e.target.closest('.top,.hud')) return;
  if (e) e.preventDefault();
  shoot();
}
let fireHold = false; // mouse held in manual fire mode
function setFireHold(on) { fireHold = on && !didEnd; }
if (mode.id === 'left' || mode.id === 'left+') {
  stage.addEventListener('click', tryLeftShoot);
  stage.addEventListener('pointerdown', e => {
    if (e.button === 0) { tryLeftShoot(e); setFireHold(true); }
  });
  stage.addEventListener('pointerup',   () => setFireHold(false));
  stage.addEventListener('pointercancel', () => setFireHold(false));
  stage.addEventListener('pointerleave',  () => setFireHold(false));
}
if (mode.id === 'right' || mode.id === 'right+') {
  S.bindRight(stage, () => { if (!didEnd) shoot(); }, '用右掣／兩指射');
  // also support hold for right-click / two-finger tap
  stage.addEventListener('contextmenu', e => e.preventDefault());
  stage.addEventListener('pointerdown', e => {
    if (e.button === 2) { tryLeftShoot(e); setFireHold(true); }
  });
  stage.addEventListener('pointerup',     () => setFireHold(false));
  stage.addEventListener('pointercancel', () => setFireHold(false));
  stage.addEventListener('pointerleave',  () => setFireHold(false));
}

function clearField() {
  aliens.forEach(a => a.el && a.el.remove());
  lasers.forEach(l => l.el && l.el.remove());
  alienLasers.forEach(l => l.el && l.el.remove());
  bunkers.forEach(b => b.el && b.el.remove());
  powerUps.forEach(p => p.el && p.el.remove());
  if (ufo && ufo.el) ufo.el.remove();
  aliens = []; lasers = []; alienLasers = []; bunkers = []; powerUps = []; ufo = null;
  if (raf) { cancelAnimationFrame(raf); raf = 0; }

function setHUD() {
  $('scoreLab').textContent = score + ' 分';
  $('waveLab').textContent = 'WAVE ' + Math.max(1, wave);
}

function updateHUDTrophies() {
  const el = $('trophies');
  const now = Date.now();
  const active = [
    { end: shieldEnd, emoji: '🛡️', label: '護盾' },
    { end: rapidEnd,  emoji: '⚡', label: '連射' },
    { end: boostEnd,  emoji: '💎', label: '雙倍' },
    { end: freezeEnd, emoji: '❄️', label: '暫停' },
  ].filter(p => Date.now() < p.end);
  // always show shield capacity count if any charges exist
  const parts = active.map(p => {
    const sec = Math.ceil((p.end - now) / 1000);
    return p.emoji + ' ' + sec + 's';
  });
  if (shieldCount > 0) parts.push('🛡️ ×' + shieldCount);
  if (parts.length === 0) { el.textContent = ''; return; }
  el.textContent = parts.join('  ');
}

function spawnBunkers(n) {
  bunkers.forEach(b => b.el && b.el.remove()); bunkers = [];
  if (!n) return;
  const L = layout();
  const y = L.bunkerY;
  const bw = Math.min(70, Math.max(52, L.w * 0.1));
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'bunker';
    el.style.width = bw + 'px';
    const x = ((i + 1) / (n + 1)) * L.w - bw / 2;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    stage.appendChild(el);
    bunkers.push({ el, x, y, w: bw, h: 34, hp: 3 });
  }
}

const ALIEN_KINDS = {
  normal:   { color: '#FFFFFF', bonus: 0,  hp: 1, label: '' },
  kamikaze: { color: '#FF1744', bonus: 5,  hp: 1, label: '🔥' },
  stealth:  { color: '#80DEEA', bonus: 8,  hp: 1, label: '👻' },
  healer:   { color: '#69F0AE', bonus: 6,  hp: 1, label: '➕' },
  armored:  { color: '#FFB300', bonus: 10, hp: 2, label: '🛡' },
  splitter: { color: '#CE93D8', bonus: 12, hp: 1, label: '💥' },
};
function pickAlienKind() {
  const r = Math.random();
  if (r < 0.60) return 'normal';
  if (r < 0.70) return 'kamikaze';
  if (r < 0.80) return 'stealth';
  if (r < 0.87) return 'healer';
  if (r < 0.95) return 'armored';
  return 'splitter';
}
function kindBonus(k) { return ALIEN_KINDS[k] ? ALIEN_KINDS[k].bonus : 0; }
function applyAlienKind(el, kind) {
  if (kind === 'normal') return;
  const def = ALIEN_KINDS[kind];
  el.classList.add('alien-' + kind);
  // small badge
  const badge = document.createElement('div');
  badge.className = 'alien-badge';
  badge.textContent = def.label;
  badge.style.cssText = 'position:absolute;top:-10px;right:-6px;font-size:.85rem;line-height:1;z-index:4;pointer-events:none;text-shadow:0 0 4px ' + def.color;
  el.style.position = 'relative';
  el.appendChild(badge);
  if (kind === 'armored') {
    // shield ring overlay
    el.style.boxShadow = '0 0 12px ' + def.color + ', inset 0 0 8px ' + def.color + '44';
  }
  if (kind === 'stealth') {
    el.style.opacity = '0.4';
  }
  if (kind === 'kamikaze') {
    el.style.filter = 'drop-shadow(0 0 8px ' + def.color + ') hue-rotate(-10deg)';
  }
  if (kind === 'healer') {
    el.style.filter = 'drop-shadow(0 0 6px ' + def.color + ')';
  }
  if (kind === 'splitter') {
    el.style.filter = 'drop-shadow(0 0 6px ' + def.color + ')';
  }
}

function spawnWave() {
  const L = layout();
  wave += 1;
  // Boss wave (every 5 waves)
  if (wave > 1 && wave % 5 === 0) {
    spawnBoss();
    return;
  }
  const spec = waveSpec(wave);
  const gapX = Math.min(L.alienH + 18, (L.w - 48) / Math.max(1, spec.cols));
  const gapY = spec.gapY;
  const totalW = gapX * (spec.cols - 1);
  const startX = (L.w - totalW) / 2;
  const y0 = L.alienTop + spec.yBias;
  aliens = [];
  for (let row = 0; row < spec.rows; row++) {
    for (let col = 0; col < spec.cols; col++) {
      const el = document.createElement('div');
      el.className = 'alien r' + row;
      el.innerHTML = ALIEN_SVG[Math.min(row, ALIEN_SVG.length - 1)];
      let x, y;
      if (mode.horizontal) {
        // landscape: spawn from RIGHT edge, moving left, single column
        x = L.w - 60 - col * gapX;
        y = Math.max(40, Math.min(L.h - 60, 80 + row * gapY));
      } else {
        x = startX + col * gapX;
        y = Math.min(L.alienMaxY - L.alienH, y0 + row * gapY);
      }
      el.style.left = x + 'px'; el.style.top = y + 'px';
      stage.appendChild(el);
      // pick alien kind (60% normal + 5 special types)
      const kind = pickAlienKind();
      applyAlienKind(el, kind);
      aliens.push({
        el, x, y, alive: true, wiggle: col * 0.3 + row, _row: row, _kind: kind,
        pts: ROW_PTS[Math.min(row, ROW_PTS.length - 1)] + Math.min(20, (wave - 1) * 2) + kindBonus(kind)
      });
    }
  }
  marchDir = mode.horizontal ? -1 : 1; marchN = 0; pause = false;
  eliteCount = 0; miniBossSpawned = false;
  trackingShotActive = false; spreadShotActive = false;
  // mini-boss spawn: wave 3+ (non-boss wave)
  if (wave >= 3 && wave % 5 !== 0) {
    const pool = aliens.filter(a => a.alive);
    if (pool.length > 0) {
      const boss = pool[Math.floor(Math.random() * pool.length)];
      boss._elite = true; boss._hp = 2; eliteCount++;
      boss.pts = 60 + wave * 5;
      boss.el.classList.add('elite-glow');
      boss.el.style.fontSize = '1.5rem';
      // red-pulse mini-boss indicator
      const label = document.createElement('div');
      label.style.cssText = 'position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.6rem;font-weight:900;color:#FF1744;white-space:nowrap;text-shadow:0 0 4px #FF1744';
      label.textContent = '⚡ MINI-BOSS ⚡';
      boss.el.style.position = 'relative';
      boss.el.appendChild(label);
      S.toast('⚡ MINI-BOSS 出現！');
      S.tone(440, 0.15, 'sawtooth', 0.2);
      miniBossSpawned = true;
    }
  }
  spawnBunkers(spec.bunkers);
  setHUD();
  S.toast('WAVE ' + wave + ' · ' + spec.rows + '×' + spec.cols);
  beat();
}

function spawnBoss() {
  const L = layout();
  aliens = [];
  marchDir = 1; marchN = 0; pause = false;
  const w = Math.min(140, L.w * 0.32);
  const h = Math.min(110, L.h * 0.18);
  const x = (L.w - w) / 2;
  const y = Math.max(48, L.alienTop - 10);
  const el = document.createElement('div');
  el.className = 'boss';
  el.innerHTML = BOSS_SVG;
  el.style.width = w + 'px';
  el.style.height = h + 'px';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  stage.appendChild(el);
  const bossNum = Math.floor(wave / 5);
  const hp = 14 + bossNum * 6;
  const pts = 200 + bossNum * 100;
  aliens.push({
    el, x, y, alive: true, wiggle: 0, _row: 99, _boss: true,
    pts, _hp: hp, _hpMax: hp, _w: w, _h: h,
    _vx: 1.6 + bossNum * 0.4, _dir: 1
  });
  // HP bar overlay
  const bar = document.createElement('div');
  bar.className = 'boss-hp';
  bar.innerHTML = '<div class="boss-hp-fill"></div><div class="boss-hp-text">👑 BOSS · ' + hp + '/' + hp + '</div>';
  stage.appendChild(bar);
  aliens[0]._hpBar = bar;
  // announcement
  showWaveClear();
  S.toast('👑 BOSS WAVE ' + wave + '！打佢！');
  S.tone(220, 0.3, 'sawtooth', 0.15);
  setTimeout(() => S.tone(180, 0.4, 'sawtooth', 0.15), 200);
  beat();
}

function bossHit(b, dmg, laser) {
  if (!b._boss) return false;
  if (laser && laser._drone) b._droneKilled = true;
  b._hp -= dmg;
  b.el.classList.add('hit-flash');
  setTimeout(() => b.el.classList.remove('hit-flash'), 80);
  // update HP bar
  if (b._hpBar) {
    const pct = Math.max(0, b._hp) / b._hpMax;
    b._hpBar.querySelector('.boss-hp-fill').style.width = (pct * 100) + '%';
    b._hpBar.querySelector('.boss-hp-text').textContent = '👑 BOSS · ' + Math.max(0, b._hp) + '/' + b._hpMax;
    if (pct < 0.35) b._hpBar.classList.add('low');
  }
  if (b._hp <= 0) {
    b.alive = false;
    if (b._droneKilled) droneKill(b);
    b.el.classList.add('dead');
    setTimeout(() => { if (b.el.parentNode) b.el.remove(); }, 200);
    if (b._hpBar && b._hpBar.parentNode) b._hpBar.remove();
    // big explosion
    for (let i = 0; i < 30; i++) {
      setTimeout(() => spawnParticles(b.x + b._w/2 + (Math.random()-0.5)*60, b.y + b._h/2 + (Math.random()-0.5)*40, ['#FFD54F','#FF6B9D','#00E5FF','#A5F3FC'][i%4]), i * 30);
    }
    addScore(b.pts);
    scorePop(b.x + b._w/2, b.y + b._h/2, '+' + b.pts);
    shake();
    S.confetti();
    S.sfxWin();
    achUnlock('bossSlayer');
    S.toast('👑 BOSS 擊敗！+' + b.pts);
    // 5 second break then next wave
    pause = true;
    setTimeout(() => { if (!didEnd) spawnWave(); }, 2500);
    return true;
  }
  return false;
}

function alive() { return aliens.filter(a => a.alive).length; }

function spawnPowerUp(x, y, force) {
  // bonus time: ×3 spawn rate; force = guaranteed drop (elite kill)
  const rate = force ? 1 : (Date.now() < bonusTimeEnd) ? 0.30 : 0.10;
  if (!force && Math.random() > rate) return;
  const type = PU_TYPES[Math.floor(Math.random() * PU_TYPES.length)];
  const el = document.createElement('div');
  el.className = 'pu pu-' + type.id;
  el.innerHTML = type.icon;
  el.style.left = (x - 14) + 'px';
  el.style.top = y + 'px';
  stage.appendChild(el);
  powerUps.push({ el, x, y, type, dy: 2.2 + Math.random() * 0.8 });
  S.tone(600, 0.04, 'sine', 0.06);
}

function tickPowerUps() {
  powerUps = powerUps.filter(pu => {
    pu.y += pu.dy;
    pu.el.style.top = pu.y + 'px';
    const r = stage.getBoundingClientRect();
    const sy = mode.freeMove ? shipY : r.height - 44;
    const shipLeft = shipX * r.width - 28;
    // hit ship?
    if (pu.y >= sy - 36 && pu.y <= sy + 10 &&
        pu.x >= shipLeft - 14 && pu.x <= shipLeft + 56) {
      activatePowerUp(pu.type);
      pu.el.remove();
      return false;
    }
    if (pu.y > r.height + 30) { pu.el.remove(); return false; }
    return true;
  });
}

function activatePowerUp(type) {
  const now = Date.now();
  if (type.id === 'shield') {
    shieldCount = Math.min(3, shieldCount + 1);
    shieldEnd = now + type.dur;
    S.toast('🛡️ 護盾 ×' + shieldCount + ' (' + (type.dur / 1000) + ' 秒)');
  } else if (type.id === 'rapid') {
    rapidEnd = now + type.dur;
    S.toast('⚡ 連射 ' + (type.dur / 1000) + ' 秒');
  } else if (type.id === 'score') {
    boostEnd = now + type.dur;
    S.toast('💎 雙倍 ' + (type.dur / 1000) + ' 秒');
  } else if (type.id === 'freeze') {
    freezeEnd = now + type.dur;
    S.toast('❄️ 暫停 ' + (type.dur / 1000) + ' 秒');
  } else if (type.id === 'drone') {
    spawnDrone();
    S.toast('🤖 小伙伴出動！');
  }
  // visual + audio feedback so player knows they got it
  const r = stage.getBoundingClientRect();
  const px = shipX * r.width;
  const py = mode.freeMove ? shipY : r.height - 44;
  const c = type.color || '#FFD54F';
  // 1) full-screen color flash (overrides stage.shake)
  const flash = document.createElement('div');
  flash.className = 'pu-flash';
  flash.style.color = c;
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 450);
  // 2) big particle burst (more particles, 2 rings)
  spawnPowerupBurst(px, py, c);
  setTimeout(() => spawnPowerupBurst(px, py, '#FFFFFF'), 80);
  // 3) zoom pulse on stage
  stage.classList.add('pu-pickup-zoom');
  setTimeout(() => stage.classList.remove('pu-pickup-zoom'), 380);
  // 4) shake + flash
  flashScreen();
  shake();
  S.sfxOk();
  type.sound && type.sound();
  // 5) big "POWER UP!" banner
  const banner = document.createElement('div');
  banner.className = 'pu-banner';
  banner.innerHTML = type.emoji + ' ' + type.label + '<span class="label">POWER UP!</span>';
  banner.style.cssText = 'left:' + (px - 120) + 'px; top:' + (py - 70) + 'px; color:' + c;
  stage.appendChild(banner);
  setTimeout(() => banner.remove(), 1450);
}

function spawnPowerupBurst(cx, cy, color) {
  const count = 14;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'pu-burst';
    const angle = (i / count) * Math.PI * 2;
    const dist = 30 + Math.random() * 36;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    p.style.cssText =
      'left:' + cx + 'px; top:' + cy + 'px;' +
      'background:' + color + ';' +
      '--dx:' + dx + 'px; --dy:' + dy + 'px;';
    stage.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }
}

  stage.appendChild(el);
  drone = {
    el,

    offY: -8, // slightly above ship
    end: Date.now() + 20000,
    cd: 0,
    kills: 0
  };

function tickDrone(L) {
  if (!drone || !drone.el || !drone.el.parentNode) return;
  if (Date.now() > drone.end) {
    drone.el.classList.add('fading');
    setTimeout(() => { if (drone && drone.el && drone.el.parentNode) drone.el.remove(); }, 400);
    drone = null;
    return;
  }
  // position relative to ship
  const r = stage.getBoundingClientRect();
  const shipLeft = shipX * r.width;
  const shipTop = mode.freeMove ? shipY : r.height - 44;
  const targetX = shipLeft + drone.offX;
  const targetY = shipTop + drone.offY;
  drone.el.style.left = targetX + 'px';
  drone.el.style.top = targetY + 'px';
  // auto-fire
  drone.cd -= 1;
  if (drone.cd <= 0) {
    // find nearest alive alien
    let best = null, bestDist = Infinity;
    aliens.forEach(a => {
      if (!a.alive) return;
      const ax = a._boss ? a.x + (a._w || 100) / 2 : a.x + 16;
      const ay = a._boss ? a.y + (a._h || 80) / 2 : a.y + 16;
      const d = Math.hypot(ax - targetX, ay - targetY);
      if (d < bestDist) { bestDist = d; best = a; }
    });
    if (best) {
      const ax = best._boss ? best.x + (best._w || 100) / 2 : best.x + 16;
      const ay = best._boss ? best.y + (best._h || 80) / 2 : best.y + 16;
      // spawn drone laser
      const le = document.createElement('div');
      le.className = 'laser drone-laser';
      le.textContent = '•';
      le.style.left = (targetX + 12) + 'px';
      le.style.top = (targetY + 8) + 'px';
      stage.appendChild(le);
      const dx = ax - (targetX + 12);
      const dy = ay - (targetY + 8);
      const len = Math.hypot(dx, dy) || 1;
      const spd = 6;
      lasers.push({ el: le, x: targetX + 12, y: targetY + 8, dx: dx / len * spd, dy: dy / len * spd, age: 0, player: true, _drone: true });
      drone.cd = 36; // ~600ms cooldown at 60fps
      S.tone(660, 0.04, 'sine', 0.06);
    } else {
      drone.cd = 12;
    }
  }
}

  if (aliens.length === 0) return false;
  const L = layout();
  const shipTop = L.h - L.shipLane - 12;
  return aliens.some(a => a.alive && a.y + L.alienH * 0.9 >= shipTop);
}

function marchPeriod() {
  const spec = waveSpec(wave || 1);
  const a = alive();
  const maxA = Math.max(1, spec.rows * spec.cols);
  const t = maxA <= 1 ? 1 : (maxA - a) / (maxA - 1);
  let p = Math.round(spec.basePeriod - t * (spec.basePeriod - spec.minPeriod));
  if (a === 1) p = Math.max(3, spec.minPeriod - 2);
  return Math.max(spec.minPeriod, p);
}

// Laser travel time: 440px / 14px/f = ~31 frames (~0.5s). Use 60 to be safe.
var MAX_LASER_AGE = 60;

function canShoot() {
  if (didEnd || pause) return false;
  if (isRapid()) return true; // rapid fire ignores cooldown
  const manualMode = mode.id === 'left' || mode.id === 'left+' || mode.id === 'right' || mode.id === 'right+';
  if (manualMode) {
    // manual fire: allow rapid re-fire every HOLD_COOLDOWN ms while held, or instant on click
    if (Date.now() < manualCool) return false;
    return true;
  }
  // auto move/move+: single-shot until existing laser is older than MAX_LASER_AGE
  if (lasers.some(L => L.player && L.age < MAX_LASER_AGE)) return false;
  if (Date.now() < autoCool) return false;
  return true;
}

const HOLD_COOLDOWN = 220; // ms between shots while held

function shoot() {
  if (!canShoot()) return;
  const manualMode = mode.id === 'left' || mode.id === 'left+' || mode.id === 'right' || mode.id === 'right+';
  // ship.fireRate: higher = faster fire (lower cooldown)
  const fireRateMult = ship ? ship.fireRate : 1;
  if (manualMode) manualCool = Date.now() + HOLD_COOLDOWN / fireRateMult;
  else autoCool = Date.now() + 420 / fireRateMult;
  const r = stage.getBoundingClientRect();
  const sx = shipX * r.width;
  const sy = mode.freeMove ? shipY : r.height - 44;
  shots += 1;
  // landscape: ship fires RIGHT (horizontal); vertical: fires UP
  const speed = isRapid() ? 14 : 10;  // positive = right
  const verticalSpeed = isRapid() ? -20 : -14;  // negative = up
  // bullet pattern: single | double | flame
  const bt = ship ? ship.bulletType : 'single';
  const offsets = bt === 'double' ? [-10, 10] : [0];
  const pierce = bt === 'flame';
  const laserClass = 'laser' + (bt === 'flame' ? ' flame-laser' : '') + (mode.horizontal ? ' horizontal' : '');
  offsets.forEach(ox => {
    const el = document.createElement('div');
    el.className = laserClass;
    if (mode.horizontal) {
      // fire right from ship (shipX locked at 0.15, shipY = mouse Y)
      el.style.left = (sx + 24 + ox) + 'px';
      el.style.top  = (sy - 2.5) + 'px';
    } else {
      el.style.left = (sx - 2.5 + ox) + 'px';
      el.style.top  = (sy - 26) + 'px';
    }
    stage.appendChild(el);
    if (mode.horizontal) {
      lasers.push({ el, x: sx + 24 + ox, y: sy - 2.5 + ox * 0.3, dx: speed, dy: 0, player: true, born: Date.now(), _pierce: pierce, _hit: pierce ? new Set() : null });
    } else {
      lasers.push({ el, x: sx + ox, y: sy - 26, dx: 0, dy: verticalSpeed, player: true, born: Date.now(), _pierce: pierce, _hit: pierce ? new Set() : null });
    }
  });
  S.tone(920, 0.05, 'square', isRapid() ? 0.1 : 0.07);
}
