function killAlien(a, pts) {
  if (!a.alive) return;

  // ── mini-boss HP check ──
  if (a._elite && a._hp > 1) {
    a._hp--;
    a.el.classList.add('hit-flash');
    S.tone(330, 0.1, 'sawtooth', 0.15);
    spawnParticles(a.x + 16, a.y + 16, '#FF1744');
    setTimeout(() => a.el.classList.remove('hit-flash'), 100);
    shake();
    flashScreen();
    return; // not dead yet
  }

  // ── armored (2 HP) check ──
  if (a._kind === 'armored' && !a._armoredHit) {
    a._armoredHit = true;
    a._hp = 1;
    a.el.classList.add('hit-flash');
    S.tone(440, 0.1, 'square', 0.15);
    spawnParticles(a.x + 16, a.y + 16, '#FFB300');
    setTimeout(() => a.el.classList.remove('hit-flash'), 100);
    // visual: orange tint flashes, ring dims
    a.el.style.boxShadow = '0 0 6px #FF1744, inset 0 0 4px #FF174466';
    shake();
    return; // not dead yet
  }

  // ── splitter: spawn 2 mini aliens on death ──
  if (a._kind === 'splitter' && !a._split) {
    a._split = true;
    const cx = a.x + 16, cy = a.y + 16;
    [-1, 1].forEach((side, idx) => {
      const child = document.createElement('div');
      child.className = 'alien alien-splitter child';
      child.style.cssText = 'left:' + (cx - 12) + 'px; top:' + (cy - 12) + 'px; font-size:.8rem; opacity:.8';
      child.innerHTML = ALIEN_SVG[Math.min(a._row !== undefined ? a._row : 0, ALIEN_SVG.length - 1)];
      stage.appendChild(child);
      aliens.push({
        el: child, x: cx - 12 + side * 4, y: cy - 12, alive: true, wiggle: 0, _row: a._row,
        _kind: 'normal', pts: 5, _child: true, _vx: side * 1.5, _vy: -0.8
      });
    });
    S.tone(660, 0.1, 'sine', 0.15);
    spawnParticles(cx, cy, '#CE93D8');
  }

  a.alive = false;
  if (a._droneKilled) droneKill(a);
  // hit-flash then death
  a.el.classList.add('hit-flash');
  setTimeout(() => { a.el.classList.remove('hit-flash'); a.el.classList.add('dead'); }, 80);
  // row-matched debris colors
  const colors = ['#CE93D8', '#EF9A9A', '#80DEEA', '#A5D6A7'];
  const deathColor = (a._kind === 'kamikaze') ? '#FF1744'
    : (a._kind === 'stealth') ? '#80DEEA'
    : (a._kind === 'healer') ? '#69F0AE'
    : (a._kind === 'armored') ? '#FFB300'
    : (a._kind === 'splitter') ? '#CE93D8'
    : (colors[a._row !== undefined ? a._row : 0] || '#A5D6A7');
  spawnParticles(a.x + 16, a.y + 16, deathColor);
  const boom = document.createElement('div'); boom.className = 'boom'; boom.innerHTML = BOOM_SVG;
  boom.style.left = a.x + 'px'; boom.style.top = a.y + 'px';
  stage.appendChild(boom); setTimeout(() => boom.remove(), 360);
  const boom2 = document.createElement('div'); boom2.className = 'boom2'; boom2.innerHTML = BOOM2_SVG;
  boom2.style.left = (a.x + 6) + 'px'; boom2.style.top = (a.y + 4) + 'px';
  stage.appendChild(boom2); setTimeout(() => boom2.remove(), 310);
  setTimeout(() => { if (a.el.parentNode) a.el.remove(); }, 110);

  const now = Date.now();
  streak = (now - lastKill < 1400) ? streak + 1 : 1;
  lastKill = now;
  const c = $('combo');
  if (streak >= 2) {
    c.textContent = '連撃 ×' + streak + (streak >= 4 ? ' 🔥' : '');
    c.style.display = 'block';
    c.classList.add('on');
    clearTimeout(c._t); c._t = setTimeout(() => c.classList.remove('on'), 850);
  }
  if (streak >= 10) achUnlock('combo10');

  // combo multiplier: ×1 / ×2 / ×3
  const mult = streak >= 10 ? 3 : streak >= 5 ? 2 : 1;
  const base = pts || a.pts;
  const gain = Math.round((isBoosted() ? base * 2 : base + (streak >= 3 ? 10 : 0)) * mult);
  addScore(gain);
  const popEl = scorePop(a.x, a.y, mult > 1 ? '+' + gain + ' ×' + mult : '+' + gain);
  if (isBoosted() || mult > 1) popEl.classList.add('big-pop');
  S.sfxOk(); shake();
  if (!isFrozen()) beat();
  flashScreen();

  // power-up drop (guaranteed on elite kill, normal drop otherwise)
  const isEliteKill = !!a._elite;
  if (isEliteKill) {
    // guaranteed power-up drop
    spawnPowerUp(a.x + 16, a.y, true);
  }
  if (alive() > 0) spawnPowerUp(a.x + 16, a.y, false);
  if (alive() === 0) onWaveClear();
}

function onWaveClear() {
  pause = true;
  lasers.forEach(l => l.el && l.el.remove()); lasers = [];
  // wave clear bonus
  const bonus = 50 + wave * 25;
  addScore(bonus);
  // instant bonus pop
  const L = layout();
  const popEl = scorePop(L.w / 2, L.h / 2, '+' + bonus + ' ⭐');
  popEl.classList.add('big-pop');
  // bonus time: ×3 power-up spawn rate for 2.5 seconds
  bonusTimeEnd = Date.now() + 2500;
  showWaveClear();
  S.toast('波數獎勵 +' + bonus + ' · BONUS TIME!');
  if (wave >= 5) achUnlock('wave5');
  if (wave >= 5 && score >= 1000) achUnlock('perfect5');
  setTimeout(() => {
    if (didEnd) return;
    spawnWave();
  }, 1000);
}

function spawnUfo() {
  if (ufo || didEnd || pause) return;
  const r = stage.getBoundingClientRect();
  const el = document.createElement('div'); el.className = 'ufo'; el.textContent = '🛸';
  const dir = Math.random() < 0.5 ? 1 : -1;
  el.style.left = (dir > 0 ? -40 : r.width + 8) + 'px';
  el.style.top = '42px';
  stage.appendChild(el);
  const table = [50, 100, 150, 300];
  ufo = { el, x: dir > 0 ? -40 : r.width + 8, y: 42, dir, spd: 2.1 + Math.random() * 0.8, bonus: table[shots % 4], alive: true };
}

/* ── enemy bullets (chaos / blitz themes) ── */
function alienShootChance() {
  if (wave < 3) return 0; // grace period (first 2 waves safe)
  // ramp up: 0.010 at wave 3, +0.004 per wave, capped 0.035
  // blitz-like difficulty kicks in at high wave numbers
  return Math.min(0.035, 0.010 + (wave - 3) * 0.004);
}

function tryAlienShoot() {
  if (didEnd || pause || isFrozen()) return;
  if (Math.random() > alienShootChance()) return;
  if (alienLasers.length > 10) return; // cap concurrent
  const alive = aliens.filter(a => a.alive && !a._diving);
  if (alive.length === 0) return;
  // pick most-threatening aliens (vertical: bottom 30%; landscape: leftmost 30%)
  if (mode.horizontal) {
    alive.sort((a, b) => a.x - b.x);  // smallest x = closest to ship
  } else {
    alive.sort((a, b) => b.y - a.y);  // largest y = bottom = closest to ship
  }
  const bottom = alive.slice(0, Math.max(3, Math.floor(alive.length * 0.3)));
  const shooter = bottom[Math.floor(Math.random() * bottom.length)];

  // ── spread shot: wave ≥10, every 3rd eligible wave ──
  if (wave >= 10 && wave % 3 === 1 && !spreadShotActive && bottom.length >= 3) {
    spreadShotActive = true;
    const angles = mode.horizontal ? [Math.PI + 0.22, Math.PI, Math.PI - 0.22] : [-0.22, 0, 0.22];
    [-14, 0, 14].forEach((dy, i) => {
      const el2 = document.createElement('div');
      el2.className = 'alien-laser' + (mode.horizontal ? ' horizontal' : '');
      if (mode.horizontal) {
        el2.style.left = shooter.x + 'px';
        el2.style.top  = (shooter.y + 14 + dy) + 'px';
      } else {
        el2.style.left = (shooter.x + 14 + dy) + 'px';
        el2.style.top  = (shooter.y + 24) + 'px';
      }
      stage.appendChild(el2);
      const angle = angles[i];
      const spd = 3.6 + Math.random() * 0.5;
      alienLasers.push({ el: el2, x: mode.horizontal ? shooter.x : shooter.x + 14 + dy, y: mode.horizontal ? shooter.y + 14 + dy : shooter.y + 24, dx: Math.sin(angle) * spd, dy: Math.cos(angle) * spd });
    });
    shooter.el.classList.add('elite-shoot');
    setTimeout(() => shooter.el && shooter.el.classList.remove('elite-shoot'), 150);
    S.tone(180, 0.06, 'sawtooth', 0.08);
    return;
  }

  // ── tracking shot: wave ≥7, once per wave ──
  if (wave >= 7 && !trackingShotActive) {
    trackingShotActive = true;
    const el = document.createElement('div');
    el.className = 'alien-laser' + (mode.horizontal ? ' horizontal' : '');
    if (mode.horizontal) {
      el.style.left = shooter.x + 'px';
      el.style.top  = (shooter.y + 14) + 'px';
    } else {
      el.style.left = (shooter.x + 14) + 'px';
      el.style.top  = (shooter.y + 24) + 'px';
    }
    stage.appendChild(el);
    if (mode.horizontal) {
      alienLasers.push({ el, x: shooter.x, y: shooter.y + 14, dx: -3.8, dy: 0, _tracked: true });
    } else {
      alienLasers.push({ el, x: shooter.x + 14, y: shooter.y + 24, dx: 0, dy: 3.8, _tracked: true });
    }
    shooter.el.classList.add('elite-shoot');
    setTimeout(() => shooter.el && shooter.el.classList.remove('elite-shoot'), 150);
    S.tone(300, 0.05, 'sawtooth', 0.08);
    return;
  }

  const el = document.createElement('div');
  el.className = 'alien-laser' + (mode.horizontal ? ' horizontal' : '');
  if (mode.horizontal) {
    el.style.left = shooter.x + 'px';
    el.style.top  = (shooter.y + 14) + 'px';
  } else {
    el.style.left = (shooter.x + 14) + 'px';
    el.style.top  = (shooter.y + 24) + 'px';
  }
  stage.appendChild(el);
  if (mode.horizontal) {
    alienLasers.push({ el, x: shooter.x, y: shooter.y + 14, dx: -3.6 - Math.random() * 0.6, dy: 0 });
  } else {
    alienLasers.push({ el, x: shooter.x + 14, y: shooter.y + 24, dx: 0, dy: 3.6 + Math.random() * 0.6 });
  }
  // brief red flash on shooter
  shooter.el.classList.add('shooting');
  setTimeout(() => shooter.el && shooter.el.classList.remove('shooting'), 120);
  S.tone(220, 0.04, 'sawtooth', 0.06);
}

function tickAlienLasers(L) {
  alienLasers = alienLasers.filter(shot => {
    // ── tracking: nudge toward ship (axis depends on mode) ──
    if (shot._tracked) {
      if (mode.horizontal) {
        // track Y (alien laser flies LEFT, ship moves up/down)
        const shipCy = shipY;
        const dy = shipCy - shot.y;
        const factor = Math.min(1, Math.abs(dy) / 280) * 0.9;
        shot.dy += dy > 0 ? factor : -factor;
        shot.dy = Math.max(-2.5, Math.min(2.5, shot.dy));
      } else {
        const shipCx = shipX * L.w;
        const dx = shipCx - shot.x;
        const factor = Math.min(1, Math.abs(dx) / 280) * 0.9;
        shot.dx += dx > 0 ? factor : -factor;
        shot.dx = Math.max(-2.5, Math.min(2.5, shot.dx));
      }
    }
    shot.x += shot.dx;
    shot.y += shot.dy;
    shot.el.style.left = shot.x + 'px';
    shot.el.style.top  = shot.y + 'px';
    // off-screen check (axis-aware)
    if (mode.horizontal) {
      if (shot.x < -20) { shot.el.remove(); return false; }
    } else {
      if (shot.y > L.h + 20) { shot.el.remove(); return false; }
    }
    if (shot.x > L.w + 20 || shot.y < -20 || shot.y > L.h + 20) { shot.el.remove(); return false; }
    // hit bunker (only in vertical mode)
    if (!mode.horizontal) for (const b of bunkers) {
      if (b.hp <= 0) continue;
      if (shot.x >= b.x - 2 && shot.x <= b.x + b.w + 2 &&
          shot.y >= b.y - 2 && shot.y <= b.y + b.h + 6) {
        b.hp -= 1;
        b.el.classList.remove('d2', 'd1', 'dead');
        if (b.hp <= 0) b.el.classList.add('dead');
        else if (b.hp === 1) b.el.classList.add('d1');
        else b.el.classList.add('d2');
        shot.el.remove();
        S.tone(180, 0.05, 'square', 0.05);
        return false;
      }
    }
    // hit wall (Turtle skill) — only in vertical mode
    if (!mode.horizontal && Date.now() < wallEnd && wallHitsLeft > 0) {
      const wallX = shipX * L.w;
      const wallY = (L.h - L.shipLane - 12) - 110;
      if (shot.x >= wallX - 8 && shot.x <= wallX + 8 &&
          shot.y >= wallY && shot.y <= wallY + 120) {
        shot.el.remove();
        wallHitsLeft--;
        S.tone(330, 0.08, 'sine', 0.12);
        spawnParticles(shot.x, shot.y, '#69F0AE');
        if (wallHitsLeft <= 0) {
          wallEnd = 0;
          S.toast('💥 盾牆粉碎！');
        }
        return false;
      }
    }
    // hit ship (axis-aware: landscape ship is on left, vertical extent)
    let shipTop, shipLeft;
    if (mode.horizontal) {
      shipLeft = shipX * L.w - 28;
      shipTop = shipY - 28;
    } else {
      shipTop = L.h - L.shipLane - 12;
      shipLeft = shipX * L.w - 28;
    }
    const hitW = mode.horizontal ? 56 : 56;
    const hitH = mode.horizontal ? 56 : 30;
    if (shot.y >= shipTop && shot.y <= shipTop + hitH &&
        shot.x >= shipLeft && shot.x <= shipLeft + hitW) {
      shot.el.remove();
      // check ACTIVE shield timer first (NOT charges — isShielded() also true for charges)
      if (Date.now() < shieldEnd) {
        shieldEnd = 0;
        S.toast('🛡️ 擋住！'); S.tone(220, 0.2, 'sawtooth', 0.1);
        flashScreen(); shake();
        spawnParticles(shot.x, shipTop, '#00E5FF');
      } else if (shieldCount > 0) {
        // shield capacity: consume one shield charge
        shieldCount--;
        if (shieldCount === 0) shieldEnd = 0;
        renderLives();
        S.toast('🛡️ ×' + shieldCount + ' 擋住！'); S.tone(220, 0.2, 'sawtooth', 0.1);
        flashScreen(); shake();
        spawnParticles(shot.x, shipTop, '#00E5FF');
      } else if (!isInvincible()) {
        doHit();
      }
      return false;
    }
    return true;
  });
}

function hitBunker(L) {
  for (const b of bunkers) {
    if (b.hp <= 0) continue;
    if (L.x >= b.x - 2 && L.x <= b.x + b.w + 2 && L.y >= b.y - 2 && L.y <= b.y + b.h + 6) {
      b.hp -= 1;
      b.el.classList.remove('d2', 'd1', 'dead');
      if (b.hp <= 0) b.el.classList.add('dead');
      else if (b.hp === 2) b.el.classList.add('d2');
      else b.el.classList.add('d1');
      return true;
    }
  }
  return false;
}

function tick() {
  if (didEnd) return;
  if (userPaused) {
    raf = requestAnimationFrame(tick);
    return;
  }
  const L = layout();
  const r = { width: L.w, height: L.h, left: 0 };
  const spec = waveSpec(wave || 1);
  const maxY = L.alienMaxY - L.alienH;

  // auto-shoot for move modes + iPad + WASD (no manual fire needed)
  if ((mode.id === 'move' || mode.id === 'move+' || mode.id === 'ipad' || mode.id === 'wasd') && canShoot()) shoot();
  if (fireHold && canShoot()) shoot(); // manual hold = rapid fire
  // iPad D-pad / WASD keyboard movement (overrides mouse in those modes)
  if (mode.id === 'ipad' || mode.id === 'wasd') {
    if (keyLeft) shipX = Math.max(0.06, shipX - 0.014);
    if (keyRight) shipX = Math.min(0.94, shipX + 0.014);
    shipWrap.style.left = (shipX * 100) + '%';
  }

  ufoT += 1;
  if (ufoT > 55 * 18 && Math.random() < 0.012) { ufoT = 0; spawnUfo(); }
  if (ufo && ufo.alive) {
    ufo.x += ufo.dir * ufo.spd;
    ufo.el.style.left = ufo.x + 'px';
    if (ufo.x < -70 || ufo.x > L.w + 70) { ufo.el.remove(); ufo = null; }
  }

  // freeze — aliens stop marching
  if (!isFrozen()) {
    marchN += 1;
    if (!pause && marchN >= marchPeriod()) {
      marchN = 0;
      let hitEdge = false;
      aliens.forEach(a => {
        if (!a.alive) return;
        a.x += marchDir * (9 + wave * 0.5);
        if (a.x < 6 || a.x > L.w - 34) hitEdge = true;
      });
      if (mode.horizontal) {
        // landscape: march only LEFT, drop Y when bouncing off right wall
        if (hitEdge) {
          // bounce: keep moving left, but nudge Y down a bit
          aliens.forEach(a => {
            if (!a.alive) return;
            if (a.y + spec.drop < L.h - 30) a.y += spec.drop;
          });
        }
        // also clamp: when alien reaches left edge (x < 0), remove + threat
        aliens.forEach(a => {
          if (!a.alive) return;
          if (a.x < -20) {
            a.alive = false; a.el.classList.add('dead');
            setTimeout(() => { if (a.el.parentNode) a.el.remove(); }, 110);
          }
        });
      } else {
        if (hitEdge) {
          marchDir *= -1;
          aliens.forEach(a => {
            if (!a.alive) return;
            if (a.y + spec.drop <= maxY) a.y += spec.drop;
          });
        }
      }
      beat();
    }
  }

  // ── special alien type behaviors (per-frame) ──
  if (!isFrozen()) {
    const now = Date.now();
    aliens.forEach(a => {
      if (!a.alive || a._boss || a._elite) return;
      // splitter child: fly outward
      if (a._child) {
        a.x += (a._vx || 0); a.y += (a._vy || 0);
        a._vy = (a._vy || 0) + 0.06; // gravity
        a.el.style.left = a.x + 'px';
        a.el.style.top = a.y + 'px';
        if (a.y > L.h + 20 || a.x < -30 || a.x > L.w + 30) {
          a.alive = false; a.el.classList.add('dead');
          setTimeout(() => { if (a.el.parentNode) a.el.remove(); }, 80);
        }
        return;
      }
      // kamikaze: dive toward ship (slight velocity nudge)
      if (a._kind === 'kamikaze') {
        const sx = shipX * L.w, sy = mode.horizontal ? shipY : (L.h - 28);
        const tx = mode.horizontal ? a.x : sx;
        const ty = mode.horizontal ? sy : a.y;
        const dx = tx - a.x, dy = ty - a.y;
        const d = Math.hypot(dx, dy) || 1;
        a.x += (dx / d) * 1.6;
        a.y += (dy / d) * 1.6;
        a.el.style.left = a.x + 'px';
        a.el.style.top = a.y + 'px';
        // kamikaze hits ship → threat (lose life)
        if (!mode.horizontal) {
          if (a.y + 24 >= L.h - L.shipLane - 12 && Math.abs(a.x + 16 - sx) < 32) {
            a.alive = false; a.el.classList.add('dead');
            setTimeout(() => { if (a.el.parentNode) a.el.remove(); }, 80);
            spawnParticles(a.x + 16, a.y + 16, '#FF1744');
            if (Date.now() < shieldEnd) {
              shieldEnd = 0; S.toast('🛡️ 擋住！');
            } else if (shieldCount > 0) {
              shieldCount--; if (shieldCount === 0) shieldEnd = 0; renderLives();
              S.toast('🛡️ ×' + shieldCount + ' 擋住！');
            } else if (!isInvincible()) doHit();
          }
        } else {
          if (a.x < 60 && Math.abs(a.y + 16 - sy) < 32) {
            a.alive = false; a.el.classList.add('dead');
            setTimeout(() => { if (a.el.parentNode) a.el.remove(); }, 80);
            spawnParticles(a.x + 16, a.y + 16, '#FF1744');
            if (Date.now() < shieldEnd) {
              shieldEnd = 0; S.toast('🛡️ 擋住！');
            } else if (shieldCount > 0) {
              shieldCount--; if (shieldCount === 0) shieldEnd = 0; renderLives();
              S.toast('🛡️ ×' + shieldCount + ' 擋住！');
            } else if (!isInvincible()) doHit();
          }
        }
        return;
      }
      // stealth: toggle visibility every 3s
      if (a._kind === 'stealth') {
        const phase = Math.floor(now / 3000) % 2;
        a.el.style.opacity = phase ? '1' : '0.35';
        return;
      }
      // healer: every 5s, heal nearest alive alien
      if (a._kind === 'healer') {
        a._healCool = (a._healCool || 0) - 16;
        if (a._healCool <= 0) {
          a._healCool = 5000;
          // find closest alive alien and remove 'dead' tag (visual)
          let closest = null, bestD = Infinity;
          aliens.forEach(o => {
            if (o === a || !o.alive || o._kind === 'healer') return;
            const d = Math.hypot(o.x - a.x, o.y - a.y);
            if (d < bestD && d < 200) { bestD = d; closest = o; }
          });
          if (closest) {
            // visual: flash green aura
            a.el.classList.add('aura-active');
            setTimeout(() => a.el.classList.remove('aura-active'), 400);
            // small green pulse
            const pulse = document.createElement('div');
            pulse.style.cssText = 'position:absolute;left:' + a.x + 'px;top:' + a.y + 'px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#69F0AE 0%,transparent 70%);pointer-events:none;z-index:3;animation:puFlash .35s ease-out forwards;color:#69F0AE';
            stage.appendChild(pulse);
            setTimeout(() => pulse.remove(), 400);
            S.tone(880, 0.06, 'sine', 0.1);
          }
        }
        return;
      }
    });
  }

  // boss: side-to-side slow movement + bobbing
  aliens.forEach(a => {
    if (!a._boss || !a.alive) return;
    a.x += a._dir * a._vx;
    if (a.x < 4) { a.x = 4; a._dir = 1; }
    if (a.x + a._w > L.w - 4) { a.x = L.w - 4 - a._w; a._dir = -1; }
    a.y = Math.max(40, a.y + Math.sin(Date.now() / 380) * 0.6);
    a.el.style.left = a.x + 'px';
    a.el.style.top = a.y + 'px';
  });

  tickPowerUps();
  tickDrone(L);
  tryAlienShoot();
  tickAlienLasers(L);

  // danger border when alien near ship lane
  if (inDanger()) {
    stage.classList.add('danger');
  } else {
    stage.classList.remove('danger');
  }

  // invincibility blink on ship
  if (isInvincible()) {
    const blink = Math.floor(Date.now() / 80) % 2;
    shipWrap.style.opacity = blink ? '0.25' : '1';
  } else {
    shipWrap.style.opacity = '1';
  }

  // alien reaching ship lane = threat check
  {
    const L = layout();
    const shipTop = L.h - L.shipLane - 8;
    for (const a of aliens) {
      if (!a.alive) continue;
      const ah = a._boss ? a._h : L.alienH;
      let threatened = false;
      if (mode.horizontal) {
        // landscape: alien reaches ship area (left side) = threat
        if (a.x < 90) threatened = true;
      } else {
        if (a.y + ah * 0.85 >= shipTop) threatened = true;
      }
      if (threatened) {
        a.alive = false; a.el.classList.add('dead');
        setTimeout(() => { if (a.el.parentNode) a.el.remove(); }, 110);
        if (a._hpBar && a._hpBar.parentNode) a._hpBar.remove();
        // check ACTIVE shield timer first (NOT isShielded() — that includes charges)
        if (Date.now() < shieldEnd) {
          shieldEnd = 0; // consume shield
          S.toast('🛡️ 擋住！'); S.tone(220, 0.2, 'sawtooth', 0.1);
          flashScreen(); shake();
        } else if (shieldCount > 0) {
          shieldCount--;
          if (shieldCount === 0) shieldEnd = 0;
          renderLives();
          S.toast('🛡️ ×' + shieldCount + ' 擋住！');
          flashScreen(); shake();
        } else if (!isInvincible()) {
          doHit();
        }
      }
    }
  }

  // update shield visual
  const shield = $('shipShield');
  if (isShielded()) {
    const sw = $('shipWrap');
    const rect = sw.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    shield.style.width = (rect.width + 16) + 'px';
    shield.style.height = (rect.height + 16) + 'px';
    shield.style.left = (rect.left - stageRect.left - 8) + 'px';
    shield.style.top = (rect.top - stageRect.top - 8) + 'px';
    shield.classList.add('on');
  } else {
    shield.classList.remove('on');
  }

  updateHUDTrophies();
  updateSkillBtn();
  tickWall(L);

  aliens.forEach(a => {
    if (!a.alive) return;
    if (a.y > maxY) a.y = maxY; // safety clamp
    a.wiggle += 0.07;
    a.el.style.left = a.x + 'px';
    a.el.style.top = (a.y + Math.sin(a.wiggle) * 2.2) + 'px';
  });

  lasers = lasers.filter(laser => {
    laser.age = (laser.age || 0) + 1;
    laser._px = laser.x; laser._py = laser.y;
    laser.x += laser.dx; laser.y += laser.dy;
    laser.el.style.left = (laser.x - 2.5) + 'px'; laser.el.style.top = laser.y + 'px';
    if (laser.y < -28 || laser.x < -40 || laser.x > L.w + 40) { laser.el.remove(); return false; }
    if (laser.player && hitBunker(laser)) { laser.el.remove(); return false; }
    if (laser.player && ufo && ufo.alive) {
      if (Math.abs((ufo.x + 18) - laser.x) < 34 && Math.abs((ufo.y + 14) - laser.y) < 26) {
        laser.el.remove();
        addScore(ufo.bonus);
        scorePop(ufo.x, ufo.y, 'UFO +' + ufo.bonus);
        S.toast('神秘飛碟 +' + ufo.bonus); S.sfxOk(); S.confetti(); shake();
        ufo.alive = false; ufo.el.remove(); ufo = null;
        return false;
      }
    }
    // swept hit-test: check both previous and current position so fast bullets can't skip
    const minX = Math.min(laser._px, laser.x), maxX = Math.max(laser._px, laser.x);
    const minY = Math.min(laser._py, laser.y), maxY = Math.max(laser._py, laser.y);
    for (const a of aliens) {
      if (!a.alive) continue;
      const aw = a._boss ? (a._w || 100) : 32;
      const ah = a._boss ? (a._h || 80) : 32;
      const ax = a._boss ? (a.x + aw/2) : (a.x + 16);
      const ay = a._boss ? (a.y + ah/2) : (a.y + 16);
      const hitW = a._boss ? aw * 0.5 : 22;
      const hitH = a._boss ? ah * 0.5 : 22;
      // AABB overlap between laser segment and alien hit box
      if (maxX >= ax - hitW && minX <= ax + hitW &&
          maxY >= ay - hitH && minY <= ay + hitH) {
        // pierce (flame) lasers skip aliens already hit
        if (laser._pierce && laser._hit && laser._hit.has(a)) continue;
        if (laser._drone) a._droneKilled = true;
        let didKill = false;
        if (a._boss) {
          if (bossHit(a, 1, laser)) didKill = true;
        } else {
          killAlien(a);
          didKill = true;
        }
        // piercing: keep laser alive, mark alien as hit, leave burn dot
        if (laser._pierce) {
          laser._hit && laser._hit.add(a);
          // burn dot at hit position
          const bd = document.createElement('div');
          bd.className = 'burn-dot';
          bd.style.left = (ax - 8) + 'px';
          bd.style.top  = (ay - 8) + 'px';
          bd.style.width = '16px';
          bd.style.height = '16px';
          stage.appendChild(bd);
          setTimeout(() => bd.remove(), 800);
          continue; // check next alien
        }
        laser.el.remove();
        return false;
      }
    }
    return true;
  });

  raf = requestAnimationFrame(tick);
}

function endRun(fromClear) {
  if (didEnd) return;
  didEnd = true;
  $('win').style.display = ''; // clear any inline display:none
  clearField();
  const rec = S.recordScore(modeId, score, wave);
  const tier = S.tierFrom(score, wave);
  const tm = S.TIER[tier];
  S.confetti(); S.sfxWin();
  $('winMedal').textContent = tm.medal;
  $('winScore').textContent = score + ' 分';
  $('winMsg').textContent = displayName + ' · ' + mode.title + ' · WAVE ' + wave +
    (rec.isNew ? ' · 新紀錄！' : ' · 最高 ' + rec.best);
  $('win').classList.add('on');
  if (S.autoSpeak()) S.speak('做得好，' + score + '分');
}

function printCert() {
  const tier = S.tierFrom(score, wave);
  const tm = S.TIER[tier];
  $('certTitle').textContent = tm.medal + ' ' + tm.label + ' · 太空滑鼠入侵';
  $('certName').textContent = displayName;
  $('certSkill').textContent = mode.emoji + ' ' + mode.skill + '（' + mode.title + '）';
  $('certScore').textContent = score + ' 分 · WAVE ' + wave;
  document.body.classList.add('printing');
  const done = () => document.body.classList.remove('printing');
  window.addEventListener('afterprint', done, { once: true });
  setTimeout(() => window.print(), 80);
}

function start() {
  clearField();
  didEnd = false; userPaused = false; setPausedUI(false);
  score = 0; wave = 0; streak = 0; lastKill = 0;
  shots = 0; ufoT = 0; autoCool = 0; manualCool = 0; pause = false; marchDir = 1; marchN = 0;
  // ship stats: HP, shield cap, fire rate, bullet type
  shipMaxLife = ship ? ship.hp : 3;
  shipLife = shipMaxLife;
  shieldCount = ship ? ship.shield : 3;
  bonusTimeEnd = 0;
  // reset skill state
  skillCdEnd = 0; dashEnd = 0; wallEnd = 0; wallHitsLeft = 0;
  if (wallEl && wallEl.parentNode) { wallEl.remove(); wallEl = null; }
  invincibleEnd = 0;
  fireHold = false;
  shipX = 0.5; shipWrap.style.left = '50%';
  // init shipY once stage has real height
  const L = layout();
  shipY = L.h - L.shipLane;
  shipWrap.style.top = shipY + 'px';
  $('combo').classList.remove('on');
  $('waveClear').classList.remove('on');
  $('win').classList.remove('on');
  renderLives();
  setHUD();
  // wait 1 frame so flex stage has real height before spawn
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      spawnWave();
      if (!raf) raf = requestAnimationFrame(tick);
    });
  });
}

start();
window.addEventListener('resize', () => {
  if (didEnd || pause) return;
  // keep ship visible on rotate
  shipWrap.style.left = (shipX * 100) + '%';
});

/* ── 成就系統 ── */
const ACH = [
  { id: 'first100',  sticker: '🏆', label: '首次 100 分',  hint: '任何 mode 攞到 100 分' },
  { id: 'first500',  sticker: '⭐', label: '首次 500 分',  hint: '任何 mode 攞到 500 分' },
  { id: 'wave5',     sticker: '🛡️', label: 'Wave 5 達人',   hint: '打到第 5 wave' },
  { id: 'combo10',   sticker: '🔥', label: '連擊王 ×10',    hint: '一次 combo 10 隻' },
  { id: 'perfect5',  sticker: '💎', label: '完美 5 wave',   hint: '5 個 wave 全清冇漏' },
  { id: 'bossSlayer',sticker: '👑', label: 'Boss 擊殺者',   hint: '擊敗第 1 隻 boss' },
  { id: 'drone10',   sticker: '🤖', label: 'Drone 駕駛員', hint: '用 drone 殺 10 隻外星人' },
  { id: 'slowmo',    sticker: '⏱️', label: '絕處逢生',     hint: 'Slow-mo 救援觸發 3 次' },
];

const ACH_KEY = 'si_mouse_ach_v1';
let achState = {}; // { id: { date, count } }
try { achState = JSON.parse(localStorage.getItem(ACH_KEY) || '{}'); } catch(e){}

function achUnlocked(id) { return !!(achState[id] && achState[id].unlocked); }
function achCount(id) { return (achState[id] && achState[id].count) || 0; }
function achTotal() { return ACH.filter(a => achUnlocked(a.id)).length; }

function achUnlock(id) {
  if (achUnlocked(id)) return false;
  const def = ACH.find(a => a.id === id);
  if (!def) return false;
  achState[id] = { unlocked: true, date: new Date().toISOString().slice(0,10) };
  saveAch();
  showStickerToast(def);
  S.tone(880, 0.12, 'triangle', 0.12);
  setTimeout(() => S.tone(1175, 0.18, 'triangle', 0.12), 120);
  return true;
}

function achBump(id) {
  // increment counter (e.g. for "use drone 10 times")
  if (!achState[id]) achState[id] = { unlocked: false, count: 0 };
  achState[id].count = (achState[id].count || 0) + 1;
  saveAch();
}

function achCheckBump(id, threshold) {
  achBump(id);
  if (achCount(id) >= threshold) achUnlock(id);
}

function saveAch() {
  try { localStorage.setItem(ACH_KEY, JSON.stringify(achState)); } catch(e){}
}

function showStickerToast(def) {
  const t = document.createElement('div');
  t.className = 'ach-toast';
  t.innerHTML = '<div class="ach-sticker">' + def.sticker + '</div><div class="ach-text"><div class="ach-label">🏅 成就解鎖</div><div class="ach-name">' + def.label + '</div></div>';
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('in'), 30);
  setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 400); }, 3200);
}

function openAlbum() {
  const grid = $('albumGrid');
  grid.innerHTML = '';
  ACH.forEach(a => {
    const got = achUnlocked(a.id);
    const card = document.createElement('div');
    card.className = 'sticker-card' + (got ? '' : ' locked');
    card.innerHTML = '<span class="sticker-icon">' + a.sticker + '</span><div class="sticker-label">' + a.label + '</div><div class="sticker-hint">' + (got ? a.hint : '???') + '</div>';
    grid.appendChild(card);
  });
  const total = ACH.length;
  const gotN = achTotal();
  $('albumText').textContent = gotN + ' / ' + total;
  $('albumFill').style.width = (gotN / total * 100) + '%';
  $('album').style.display = ''; // clear inline style if any
  $('album').classList.add('on');
}

function closeAlbum() {
  $('album').classList.remove('on');
  $('album').style.display = 'none';
}

$('btnStickers').onclick = openAlbum;
$('btnAlbumClose').onclick = closeAlbum;
</script>
